[workspace]
resolver = "2"
members = [
    "crates/openpfe",
    "crates/openpfe-server",
    "crates/openpfe-ipc",
    "crates/openpfe-ui",
    "crates/openpfe-webui",
    "crates/openpfe-mcp",
    "crates/openpfe-graph",
    "crates/openpfe-llm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/npetzall/openpfe"
publish = false

[workspace.dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "sync", "net", "signal"] }
axum = "0.8"
fd-lock = "4.0"
clap = { version = "4.5", features = ["derive", "env"] }
webbrowser = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
libc = "0.2"
